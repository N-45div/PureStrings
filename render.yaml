# PureStrings on Render (render.com): New > Blueprint, pick this repository. Render builds the Dockerfile and
# keeps everything on a 1 GB disk at /data. It asks for the keys marked sync: false, makes PURESTRINGS_TOKEN for
# you (the web app asks for it: Environment shows it), and serves PureStrings at https://<name>.onrender.com,
# which it also uses as its public address (RENDER_EXTERNAL_URL).
#
# Render's free plan has no disk: on it, remove the disk below and PureStrings starts empty after each deploy.
services:
  - type: web
    name: purestrings
    runtime: docker
    plan: starter
    # Close to PayPal's and OpenAI's APIs. Render can't change this later.
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/info
    disk:
      name: purestrings-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "7700"
      - key: PURESTRINGS_TOKEN
        generateValue: true
      # A model for allowances from your words and drafted disputes, and the button's voice: OpenAI's here
      # (MODEL_KEY is an OpenAI API key). Nemotron on Nebius Token Factory works too: set NEBIUS_API_KEY instead.
      - key: MODEL_URL
        value: https://api.openai.com/v1
      - key: MODEL
        value: gpt-4.1-mini
      - key: MODEL_KEY
        sync: false
      # No USB on a host: a button links from the Key screen in your browser, or over Wi-Fi.
      - key: PURESTRINGS_USB
        value: "off"
      # Bean & Leaf, the demo shop at /shop: a PayPal sandbox app with Vault on, the webhook's id
      # (npm run paypal:webhook -- https://<name>.onrender.com/shop/paypal/webhook prints it), and a token for the
      # shop's own pages.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SHOP_ADMIN_TOKEN
        generateValue: true
